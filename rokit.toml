# Roblox toolchain for local machines: install Rokit (https://github.com/rojo-rbx/rokit),
# then run `rokit install` in this folder. Versions match what the cloud container builds
# with tools/setup-cloud-toolchain.sh.

[tools]
rojo = "rojo-rbx/rojo@7.7.1"
wally = "UpliftGames/wally@0.3.2"
lune = "lune-org/lune@0.11.1"
selene = "Kampfkarren/selene@0.31.0"
stylua = "JohnnyMorganz/StyLua@2.6.0"
darklua = "seaofvoices/darklua@0.19.0"
luau-lsp = "JohnnyMorganz/luau-lsp@1.70.1"
